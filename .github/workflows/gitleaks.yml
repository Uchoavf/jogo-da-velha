name: Gitleaks (segredos)

# Scan de segredos no historico. Roda o binario oficial do gitleaks direto (sem
# action de terceiro e sem licenca): em repo privado o GitHub nao tem secret
# scanning nativo, este workflow e a rede de seguranca do lado do servidor.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan de segredos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout com historico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar gitleaks (versao fixa)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Rodar gitleaks no historico
        run: /tmp/gitleaks git --redact -v --exit-code 1 --config .gitleaks.toml .
